command_timeout = 1000

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false 

format = """
 ➜\
$directory\
${custom.giturl}\
$git_branch\
$git_state\
$git_status\
$line_break\
$character
"""

# right_format = """$all"""

palette = "rose_pine"

[palettes.rose_pine]
rosewater = "#ebbcba"
flamingo = "#ebbcba"
pink = "#eb6f92"
mauve = "#c4a7e7"
red = "#eb6f92"
maroon = "#eb6f92"
peach = "#f6c177"
yellow = "#f6c177"
green = "#9ccfd8"
teal = "#9ccfd8"
sky = "#9ccfd8"
sapphire = "#9ccfd8"
blue = "#31748f"
lavender = "#c4a7e7"
text = "#e0def4"
subtext1 = "#908caa"
subtext0 = "#6e6a86"
overlay2 = "#6e6a86"
overlay1 = "#6e6a86"
overlay0 = "#524f67"
surface2 = "#403d52"
surface1 = "#26233a"
surface0 = "#1f1d2e"
base = "#191724"
mantle = "#191724"
crust = "#191724"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = " "
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
#show_always = true
#style_user = "bg:surface0 fg:text"
#style_root = "bg:surface0 fg:text"
#format = '[ $user ]($style)'

[directory]
style = "sapphire"
format = "[ $path ]($style)"
#truncation_length = 4
#truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[os]
disabled = true
#style = "bg:surface0 fg:text"

[custom.giturl]
# disabled = true
description = "Display symbol for remote Git server"
command = """
GIT_REMOTE=$(command git remote get-url origin 2> /dev/null)
if [[ "$GIT_REMOTE" =~ "github" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "gitlab" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "bitbucket" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "git" ]]; then
    GIT_REMOTE_SYMBOL=" "
else
    GIT_REMOTE_SYMBOL=" "
fi
echo "$GIT_REMOTE_SYMBOL "
"""
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
format = "at $output"

[git_branch]
symbol = "[](black) "
# format =  ' [$symbol$branch(:$remote_branch)]($style)[]'
style = "fg:lavender bg:black"
format =  '  on [$symbol$branch]($style)[](black)'

[git_status]
format = ' [($all_status$ahead_behind )]($style)'

[nodejs]
disabled = true
symbol = ""
format = '[ $symbol($version) ]($style)'

[c]
symbol = " "
format = '[ $symbol($version) ]($style)'

[rust]
symbol = ""
format = '[ $symbol($version) ]($style)'

[golang]
symbol = ""
format = '[ $symbol($version) ]($style)'
detect_files = ["go.mod"]

[php]
symbol = ""
format = '[ $symbol($version) ]($style)'

[java]
symbol = " "
format = '[ $symbol($version) ]($style)'

[kotlin]
symbol = ""
format = '[ $symbol($version) ]($style)'

[haskell]
symbol = ""
format = '[ $symbol($version) ]($style)'

[python]
symbol = ""
format = '[ $symbol($version) ]($style)'

[docker_context]
symbol = ""
format = '[ $symbol($context) ]($style)'

[time]
disabled = true
time_format = "%R"
style = "bg:peach"
format = '[[  $time ](fg:mantle bg:foam)]($style)'

[line_break]
disabled = true 

[character]
disabled = false
success_symbol = '[𝘹](bold fg:green)'
error_symbol = '[𝘹](bold fg:red)'
vimcmd_symbol = '[](bold fg:green)'
vimcmd_replace_one_symbol = '[](bold fg:purple)'
vimcmd_replace_symbol = '[](bold fg:purple)'
vimcmd_visual_symbol = '[](bold fg:lavender)'
